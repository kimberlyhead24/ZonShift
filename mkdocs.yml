site_name: ZonShift
nav:
  - Home: index.md
  - Plan: plan.md
  - Design: about.md
  - Safety:  scurity.md
  - Reference: reference.md
  - Complexity: complexity.md
  - Conventions: conventions.md

theme:
  name: readthedocs
plugins:
  - search
  - mkdocstrings:
      handlers:
        python:
          options:
            docstring_style: google
  - markdown_extensions: [admonitions, pymdownx.details, pymdownx.superfences, tables]
  
