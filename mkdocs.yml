site_name: ZonShift
site_description: Simulation-first vertical garden monitoring and thermal control
repo_url: https://github.com/kimberlyhead24/ZonShift
theme:
  name: material
  palette:
    - scheme: slate
      primary: teal
      accent: amber
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
    - scheme: default
      primary: teal
      accent: amber
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.top
    - search.suggest
    - search.highlight
    - content.code.copy
    - content.tabs.link
plugins:
  - search
markdown_extensions:
  - md_in_html
  - attr_list
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - admonition
  - pymdownx.details
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - tables
  - attr_list
  - toc:
      permalink: true
nav:
  - Home: index.md
  - Plan:
      - About: about.md
      - Roadmap and tasks: plan.md
      - Conventions: conventions.md
  - Design:
      - CRC cards: CRC.md
      - Data model: data-model.md
  - Safety:
      - Security: security.md
  - Reference:
      - API: api.md
      - Complexity: complexity.md
plugins:
  - search
  - mkdocstrings:
      handlers:
        python:
          options:
            docstring_style: google
